[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnv-mod-manager"
version = "0.1.0"

[project.scripts]
fnvmm = "fnv_mod_manager.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # pyflakes + pycodestyle + import sorting
